name: Extract and Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giải nén project.zip
        run: |
          set -e
          if [ ! -f project.zip ]; then
            echo "LOI: Khong tim thay project.zip o thu muc goc cua repo."
            ls -la
            exit 1
          fi
          rm -rf extracted
          mkdir extracted
          unzip -o project.zip -d extracted
          # Neu zip co 1 thu muc goc bao ngoai thi nhay vao trong
          if [ ! -f extracted/settings.gradle ]; then
            INNER=$(find extracted -maxdepth 1 -mindepth 1 -type d | head -n 1)
            if [ -n "$INNER" ] && [ -f "$INNER/settings.gradle" ]; then
              shopt -s dotglob
              mv "$INNER"/* extracted/
            fi
          fi
          echo "--- Noi dung sau khi giai nen ---"
          find extracted -type f | head -50
          if [ ! -f extracted/settings.gradle ]; then
            echo "LOI: Khong tim thay settings.gradle sau khi giai nen."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Chap nhan license Android SDK
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: extracted
        run: gradle assembleDebug --no-daemon --stacktrace --info

      - name: Kiem tra file APK
        run: ls -la extracted/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TomoeScan-debug-apk
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
